name: runtime-generated SOPS Zed package fixture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          flakehub: false
      - name: Verify Nix and Just contract
        run: |
          nix run --no-write-lock-file .#verify
          nix develop --no-write-lock-file --command just verify
      - name: Verify container contract
        run: |
          docker build --tag sops-just-nix-zpkg-runtime .
          docker run --rm sops-just-nix-zpkg-runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 07d01604461d00e237c7d86ad3855464167574ec
          path: _tooling/zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: 8d04bc598a4b0b464466cbec3c44d18cf2922137
          path: _tooling/zed-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Prove Zed package leak prevention
        run: |
          cargo build --locked --manifest-path _tooling/zed-cli/Cargo.toml
          ./scripts/assert-zpkg.sh "$GITHUB_WORKSPACE/_tooling/zed-cli/target/debug/zed"
