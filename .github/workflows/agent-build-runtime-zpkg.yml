name: One-shot runtime-generated SOPS zpkg migration

on:
  push:
    branches:
      - agent/den-2919-runtime-zpkg

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Port the green Just+Nix runtime-generated contract
        shell: bash
        run: |
          set -euo pipefail
          source_base='https://raw.githubusercontent.com/flags-2-env-test/sops-just-nix/main'
          mkdir -p scripts fixtures .github/workflows
          for path in .dockerignore .gitattributes .gitignore Dockerfile EXPECTED.md flake.nix justfile scripts/assert.sh fixtures/dev.fixture.dotenv fixtures/prod.fixture.dotenv; do
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error --location "$source_base/$path" -o "$path"
          done
          cat > .zpkg.toml <<'EOF'
          [package]
          org = "flags-2-env-test"
          name = "sops-just-nix-zpkg"
          version = "0.2.0"
          description = "Runtime-generated SOPS + Just + Nix + Zed package leak-prevention fixture"
          license = "MIT"

          [package.repository]
          vcs = "git"
          url = "https://github.com/flags-2-env-test/sops-just-nix-zpkg"

          [publish]
          include_readme = true
          tag_format = "v{version}"
          exclude = [
            ".env",
            ".env.*",
            "env/dec/**",
            ".fixture-runtime/**",
            ".fixture.sops.yaml",
            ".direnv/**",
          ]
          EOF
          cat > README.md <<'EOF'
          # sops-just-nix-zpkg

          Security fixture for **SOPS + Just + Nix + Zed package** interoperability.

          This lane inherits the runtime-generated identity contract from `flags-2-env-test/sops-just-nix`: private age identities, SOPS config, canonical `env/enc/{dev,prod}.env.enc`, decrypted `env/dec/**`, and root `.env` are created only during tests and removed afterward. No private identity or decrypted dotenv is committed.

          CI validates the contract through pinned Nix/Just and a clean container, then uses a pinned Zed CLI to package the repository while synthetic plaintext/runtime identity paths are present. The resulting archive must exclude `.env`, `env/dec/**`, `.fixture-runtime/**`, and temporary SOPS config while retaining the neutral fixture sources and package metadata.

          All values are synthetic. No application credential, production SOPS identity, Cloudflare token, or R2 key is used.
          EOF
          cat > scripts/assert-zpkg.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ $# -eq 1 ]] || { echo 'usage: assert-zpkg.sh /path/to/zed' >&2; exit 2; }
          zed="$1"
          [[ -x "$zed" ]] || { echo "zed binary not executable: $zed" >&2; exit 2; }

          runtime='.fixture-runtime'
          cleanup() { rm -rf -- "$runtime" env/dec env/enc .env .fixture.sops.yaml .zed; }
          trap cleanup EXIT HUP INT TERM
          cleanup
          mkdir -p "$runtime" env/dec
          printf 'AGE-SECRET-KEY-SYNTHETIC-DO-NOT-USE\n' > "$runtime/age.key"
          chmod 600 "$runtime/age.key"
          printf 'SYNTHETIC_DEV=not-a-secret\n' > env/dec/dev.env
          chmod 600 env/dec/dev.env
          ln -s env/dec/dev.env .env
          printf 'creation_rules: []\n' > .fixture.sops.yaml

          out="$(mktemp -d "${TMPDIR:-/tmp}/sops-zpkg-pack.XXXXXX")"
          "$zed" pack --out "$out" >/dev/null
          archive="$(find "$out" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          [[ -n "$archive" ]]
          files="$out/files.txt"
          tar -tzf "$archive" > "$files"

          grep -Fxq 'pkg/.zpkg.toml' "$files"
          grep -Fxq 'pkg/fixtures/dev.fixture.dotenv' "$files"
          grep -Fxq 'pkg/fixtures/prod.fixture.dotenv' "$files"
          grep -Fxq 'pkg/scripts/assert.sh' "$files"
          ! grep -Eq '^pkg/(\.env($|\.)|env/dec/|\.fixture-runtime/|\.fixture\.sops\.yaml$)' "$files"
          ! tar -xOzf "$archive" 2>/dev/null | grep -Fq 'AGE-SECRET-KEY-SYNTHETIC-DO-NOT-USE'
          ! tar -xOzf "$archive" 2>/dev/null | grep -Fq 'SYNTHETIC_DEV=not-a-secret'
          printf 'runtime-generated SOPS Zed package exclusion contract: PASS\n'
          EOF
          chmod +x scripts/assert.sh scripts/assert-zpkg.sh

          cat > .github/workflows/runtime-sops-zpkg.yml <<'EOF'
          name: runtime-generated SOPS Zed package fixture

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: runtime-sops-zpkg-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-24.04
              timeout-minutes: 35
              steps:
                - name: Checkout fixture
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false

                - name: Install pinned Nix
                  uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
                  with:
                    flakehub: false

                - name: Verify pinned Nix and Just contract
                  shell: bash
                  run: |
                    set -euo pipefail
                    nix run --no-write-lock-file .#verify
                    nix develop --no-write-lock-file --command just verify

                - name: Verify clean container contract
                  shell: bash
                  run: |
                    set -euo pipefail
                    docker build --tag sops-just-nix-zpkg-runtime .
                    docker run --rm sops-just-nix-zpkg-runtime

                - name: Checkout pinned Zed interfaces
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    repository: zed-pkg/zed-interfaces
                    ref: 07d01604461d00e237c7d86ad3855464167574ec
                    path: zed-interfaces
                    persist-credentials: false

                - name: Checkout pinned Zed CLI
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    repository: zed-pkg/zed-cli
                    ref: 8d04bc598a4b0b464466cbec3c44d18cf2922137
                    path: zed-cli
                    persist-credentials: false

                - name: Install Rust
                  uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
                  with:
                    toolchain: stable

                - name: Build Zed and prove package leak prevention
                  shell: bash
                  run: |
                    set -euo pipefail
                    cargo build --locked --manifest-path zed-cli/Cargo.toml
                    ./scripts/assert-zpkg.sh "$GITHUB_WORKSPACE/zed-cli/target/debug/zed"
          EOF
          git diff --check

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          flakehub: false

      - name: Verify Just+Nix runtime identity contract
        shell: bash
        run: |
          set -euo pipefail
          nix run --no-write-lock-file .#verify
          nix develop --no-write-lock-file --command just verify

      - name: Verify clean-container contract
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag sops-just-nix-zpkg-runtime .
          docker run --rm sops-just-nix-zpkg-runtime

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 07d01604461d00e237c7d86ad3855464167574ec
          path: zed-interfaces
          persist-credentials: false

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: 8d04bc598a4b0b464466cbec3c44d18cf2922137
          path: zed-cli
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Build Zed and prove package leak prevention
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path zed-cli/Cargo.toml
          ./scripts/assert-zpkg.sh "$GITHUB_WORKSPACE/zed-cli/target/debug/zed"

      - name: Commit verified migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-build-runtime-zpkg.yml
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -A
          git diff --cached --check
          git commit -m 'DEN-2919: runtime-generate SOPS zpkg identities'
          git push origin HEAD:agent/den-2919-runtime-zpkg
