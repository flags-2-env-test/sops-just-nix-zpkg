name: One-shot final SOPS zpkg migration

on:
  push:
    branches: [agent/den-2919-runtime-zpkg]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Copy green Just+Nix reference contract and stage it
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/flags-2-env-test/sops-just-nix.git "$tmp/reference"
          for path in .dockerignore .gitattributes .gitignore Dockerfile EXPECTED.md flake.nix justfile scripts/assert.sh fixtures; do
            rm -rf -- "$path"
            mkdir -p "$(dirname "$path")"
            cp -R "$tmp/reference/$path" "$path"
          done
          rm -rf -- "$tmp"
          printf '\n_tooling/\n' >> .gitignore
          chmod +x scripts/assert.sh scripts/assert-zpkg.sh
          git add -A
          git diff --cached --check

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          flakehub: false

      - name: Verify staged Nix + Just contract
        run: |
          nix run --no-write-lock-file .#verify
          nix develop --no-write-lock-file --command just verify

      - name: Verify clean container contract
        run: |
          docker build --tag sops-just-nix-zpkg-runtime .
          docker run --rm sops-just-nix-zpkg-runtime

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 07d01604461d00e237c7d86ad3855464167574ec
          path: _tooling/zed-interfaces
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: 8d04bc598a4b0b464466cbec3c44d18cf2922137
          path: _tooling/zed-cli
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Prove Zed package leak prevention
        run: |
          cargo build --locked --manifest-path _tooling/zed-cli/Cargo.toml
          ./scripts/assert-zpkg.sh "$GITHUB_WORKSPACE/_tooling/zed-cli/target/debug/zed"

      - name: Commit only verified permanent files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-runtime-zpkg-v3.yml
          rm -rf _tooling
          git add -A
          git diff --cached --check
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git commit -m 'DEN-2919: runtime-generate SOPS zpkg identities'
          git push origin HEAD:agent/den-2919-runtime-zpkg
